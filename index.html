<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="title_img.png"/>
    <title>
        Mastermind
    </title>
    <style>
        body {
            background-image: url("bullseye_background_5.jpg");
            background-repeat: repeat;
            background-size: 100vw;
            overflow: auto;
        }
        #title {
            color: cyan;
            text-align: center;
            font-size: 60px;
            font-family: "Comic Sans", cursive;
            cursor:default;
        }
        #input {
            position: fixed;
            width:fit-content;
            top:5%;
            left:0;
            right:0;
            margin-inline:auto;
            z-index: 1;
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }
        .back_button {
            position: fixed;
            top: 5%;
            right:5%;
            z-index:10;
            background-image: url("back_arrow.png");
            background-size: cover; /* התמונה ממלאת את הכפתור */
            height: 75px;
            width: 75px;
            background-color: white;
            border-radius:10%;
            border:2px solid black;
        }
        .start_button {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #start_button {
            width: 200px;
            height: 100px;
            font-size: 50px;
            border-radius: 12px;
            font-family: "Comic Sans", cursive;
            box-shadow: 5px 7px 5px gray;
            cursor: pointer;
            display: block;
        }
            #start_button:hover {
                background-color: lightblue;
                color: darkblue;
                box-shadow: 5px 7px 10px gray;
            }
        #settings_container {
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            background-color: #95d5b2;
            color: #0077b6;
            font-size: 40px;
            width: 750px;
            height: 250px;
            border:3px solid black;
            cursor:default;
        }
        #container {
            display: grid;
            gap: 1em;
            position: relative;
            color: blue;
            font-size: 40px;
            width: 100%;
            min-height: 50%;
        }
        .range {
            -webkit-appearance: none;
            width: 300px;
            height:15px;
            border-radius:15px;
            opacity:0.8;
            border:1px solid black;
        }
        .range:hover{
            opacity:1;
        }
            .range::-webkit-slider-thumb {
                -webkit-appearance: none;
                width:30px;
                height:30px;
                background: cyan;
                border-radius:50%;
                border:1px solid black;
            }
        .switch {
            position: relative;
            appearance: none;
            width: 50px;
            height: 27px;
            background: gray;
            border: 1px solid black;
            border-radius: 26px;
            transition: 0.2s;
        }
            .switch::before {
                content: "";
                position: absolute;
                left: 2px;
                top: 2px;
                width: 20px;
                height: 20px;
                background: white;
                border: 1px solid black;
                border-radius: 50%;
                transition: 0.2s;
            }
        .switch:checked{
            background:cyan;
        }
        .switch:checked::before{
            transform:translateX(22px)
        }
        .row_container {
            text-align: center;
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-size: 70px;
        }
        .row_answers {
            color: white;
            font-size: 40px;
        }
        .row_guesses {
            color: white;
            font-size: 70px;
        }
        .select_color {
            width: 50px;
            height: 50px;
            border: 2px solid white;
            margin-left:10px;
            border-radius:25%;
        }
        .select_color:hover {
                box-shadow: 0 0 0 8px #00ab41;
        }
        .select_color:active{
            box-shadow:0 0 0 8px green;
        }

        .selected_color {
            width: 50px;
            height: 50px;
            border: 2px solid white;
            margin-left: 10px;
            border-radius: 25%;
            box-shadow: 0 0 0 8px green;
        }

        .random_button_duplicates_or_not {
            width: 300px;
            height: 55px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 2.5px 5px rgb(80,80,80);
            background-color: lightblue;
            font-size: 35px;
            color: blue;
            border: 2px solid black;
            margin-right: 50px
        }
        .random_button_duplicates_or_not:hover {
            background-color: rgba(173, 216, 230,0.95);
            box-shadow: 2.5px 4px rgb(80,80,80);
            transform: translateY(1px)
        }
        .random_button {
            width: 200px;
            height: 55px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 2.5px 5px rgb(80,80,80);
            background-color: lightblue;
            font-size: 35px;
            color: blue;
            border: 2px solid black;
            margin-right: 50px
        }
        .random_button:hover {
            background-color: rgba(173, 216, 230,0.95);
            box-shadow: 2.5px 4px rgb(80,80,80);
            transform: translateY(1px)
        }
        .manual_button {
            width: 200px;
            height: 55px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 2.5px 5px rgb(80,80,80);
            background-color: lightblue;
            font-size: 35px;
            color: blue;
            border: 2px solid black;
        }
        .manual_button:hover {
            background-color: rgba(173, 216, 230,0.95);
            box-shadow: 2.5px 4px rgb(80,80,80);
            transform: translateY(1px)
        }
        .submit_code {
            width: 200px;
            height: 50px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 2.5px 5px rgb(80,80,80);
            background-color: lightblue;
            font-size: 25px;
            color: blue;
            border: 2px solid black;
        }
        .submit_code:hover {
            background-color: rgba(173, 216, 230,0.95);
            box-shadow: 2.5px 4px rgb(80,80,80);
            transform: translateY(1px)
        }
            #the_code{
                margin-top:50px;
                text-align:center;
                color:white;
                font-size:50px;
            }
        .the_code {
            background-color: black;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            margin: 4px;
            font-size:40px;
        }
        .the_code_manual {
            background-color: black;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            margin: 4px;
            font-size: 40px;
            box-shadow: 0px 10px rgb(80,80,80);
        }
            .the_code_manual:hover {
                background-color: rgb(80,80,80);
                box-shadow: 0 9px rgb(80,80,80);
                transform: translateY(1px);
            }

            .the_code_manual:active {
                background-color: rgb(80,80,80);
                box-shadow: 0 5px rgb(80,80,80);
                transform: translateY(5px);
            }

        .button_color {
            background-color: black;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            margin: 4px;
            box-shadow: 0px 10px rgb(80,80,80);
        }
            .button_color:hover {
                background-color: rgb(80,80,80);
                box-shadow: 0 8px rgb(80,80,80);
                transform: translateY(2px);
            }
            .button_color:active {
                background-color: rgb(80,80,80);
                box-shadow: 0 5px rgb(80,80,80);
                transform: translateY(5px);
            }
        .button_color_disabled {
            background-color: black;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            margin: 4px;
            box-shadow: 0px 10px rgb(80,80,80);
            opacity:0.6;
            cursor:not-allowed;
        }
        .button_color_used {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            margin: 4px;
        }
            .button_submit {
                width: 150px;
                height: 50px;
                border-radius: 8px;
                margin-bottom: 8px;
                box-shadow: 2.5px 5px rgb(80,80,80);
                background-color: lightblue;
                font-size: 35px;
                color: blue;
                border:2px solid black;
            }
                .button_submit:hover {
                    background-color: rgba(173, 216, 230,0.95);
                    box-shadow: 2.5px 4px rgb(80,80,80);
                    transform: translateY(1px)
                }
        .button_submit_disabled {
            width: 150px;
            opacity: 0;
        }
        .button_answer {
            background-color: black;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid white;
            margin-top: 42px;
            margin-right: 6px;
            box-shadow: 0px 0px 10px 3px rgb(80,80,80);
        }
        .button_play_again {
            width: 200px;
            height: 50px;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 2.5px 5px rgb(80,80,80);
            background-color: lightblue;
            font-size: 30px;
            color: blue;
            border: 2px solid black;
        }
        .end_overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.6);
            display: none;
            cursor: pointer;
            font-size: 200px;
            color: blue;
            text-align: center;
            z-index: 10;
        }
        .end_overlay_main{
            width:500px;
            height:500px;
            background-color:lightblue;
            opacity:0.8;
            text-align:center;
            position:absolute;
            top:50px;
            right:500px;
        }
        .center_horizontally {
            position: absolute;
            width: 350px;
            height: 1em;
            left: 50%;
            transform: translateX(-45%);
        }
    </style>
</head>
<body>
    <div id="title">
        Welcome to Neriya's game of Mastermind!
    </div>
    <br />
    <div id="input"></div>
    <button id="back_button" onclick="build_home()" class="back_button" style="display:none"></button>
    <br />
    <div class="start_button">
        <button id="start_button" onclick="build_bord()">
            start
        </button>
    </div>
    <br />
    <div id="the_code">

    </div>
    <br />
    <br />
    <div id="container"></div>
    <div id="settings_container">
        <div style="position:absolute;left:4%;">
            <span class="center_horizontally">
                Number of tries: <span id="tries_range_value_display" style="color: #283618">10</span>
            </span>
            <br />
            <input type="range" id="tries_range" class="range" min="1" max="20" value="10"
                   oninput="update_slider_display(this,document.getElementById('tries_range_value_display'))">
        </div>
        <div style="position:absolute;left:55%;">
            <span class="center_horizontally"style="transform:translateX(-35%)">
                Code length: <span id="length_range_value_display" style="color: #283618">4</span>
                </span>
                <br />
                <input type="range" id="length_range" class="range" min="1" max="8" value="4"
                       oninput="update_slider_display(this,document.getElementById('length_range_value_display'))">
            </div>
        <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 100px">
            <span class="center_horizontally"style="transform:translateX(-47%)">
                Number of colors: <span id="number_colors_range_value_display" style="color: #283618">8</span>
            </span>
            <br />
            <input type="range" id="number_colors_range" class="range" min="1" max="10" value="8"
                   oninput="update_slider_display(this,document.getElementById('number_colors_range_value_display'))">
        </div>
        <br />
        <div style="position:absolute;bottom:10px; width:fit-content;display:inline-block;">
            Allow duplicates
                <input style="position:absolute; top:30%" type="checkbox" id="allow_duplicates_checkbox" class="switch">
        </div>
    </div>
    <br />
    <div id="win_overlay" class="end_overlay" onclick="hide()">
        <div class="end_overlay_main">
            you<br />win!
            <br />
            <span style="font-size:30px; color:white">press on the screen to continue</span>
        </div>
    </div>

    <div id="lose_overlay" class="end_overlay" onclick="hide()">
        <div class="end_overlay_main" style="color:red;">
            you<br />lose!
            <br />
            <span style="font-size:30px; color:white">press on the screen to continue</span>
        </div>
    </div>

    <script src="js_Bullseye_project.js"></script>
</body>
</html>
